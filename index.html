<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="description" content="Split expenses with friends: peer-to-peer, no servers, your data stays yours." />
    <!-- script/connect/object sources restricted to mitigate XSS impact on key
         material. connect-src only needs 'self' (no fetch/WebSocket calls anywhere in the app)
         plus stun:/turn:/turns: for WebRTC ICE — it used to also allow any https:/wss: host,
         which would've let an XSS payload exfiltrate the private key to an attacker server.
         browsers ignore frame-ancestors in a meta tag, so clickjacking protection needs it
         as a real response header from the host (see INTERNAL.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' stun: turn: turns:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FairShare</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
